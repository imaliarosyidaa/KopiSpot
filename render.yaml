services:
  - type: web
    name: Coffidoor-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
